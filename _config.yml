# Site settings
# NOTE: title/description are the Italian defaults consumed by plugins
# (jekyll-feed, jekyll-sitemap). Localized copy for templates lives in
# _data/site-text.yml; author bio copy moved there too (see about_author*).
title: Il cinema come amuleto
description: Alcune osservazioni sul cinema africano e terzo cinema
logo: /assets/img/logo.webp
timezone: Europe/Rome
locale: it
paginate: 6
words_per_minute: 200

# Author settings
author: Simona Cella
author-pic: assets/img/Myself.jpeg

# Contact links
email: simona.reichmann@gmail.com
website: https://simonacella.github.io
linkedin: simona-cella-a531b4b/
github:  simonacella
facebook: simona.cella.9
instagram: simona_reichmann
imdb: nm7677685


### Do not change the settings below unless you know what you are doing ###

# Build settings
baseurl: ""
paginate_path: 'page:num'
permalink: :title:output_ext
url: https://simonacella.github.io
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-youtube

# Articles in _posts/ use the post layout by default (no layout: in front matter).
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

include: [_pages]

# Replaces Jekyll defaults — keep the stock excludes, then drop repo/docs noise from _site.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .github/
  - scripts/
  - README.md
  - LICENSE
  - NOTICE
  - REVIEW.md
  - docs/
  - renovate.json
