# Site settings
# NOTE: title stays Italian in all languages (brand name). description is the
# Italian default for plugins (jekyll-sitemap); localized
# description / about_* for templates live in _data/site-text.yml.
title: Il cinema come amuleto
description: Alcune osservazioni sul cinema africano e terzo cinema
logo: /assets/img/logo.webp
timezone: Europe/Rome
locale: it
paginate: 6
words_per_minute: 200

# Author settings
author: Simona Cella
author-pic: assets/img/Myself.jpeg

# Contact links
email: simona.reichmann@gmail.com
website: https://simonacella.github.io
linkedin: simona-cella-a531b4b/
github:  simonacella
facebook: simona.cella.9
instagram: simona_reichmann
substack: simonacella
imdb: nm7677685


### Do not change the settings below unless you know what you are doing ###

# Build settings
baseurl: ""
paginate_path: 'page:num'
permalink: :title:output_ext
url: https://simonacella.github.io
markdown: kramdown
highlighter: rouge

# Polyglot (IT default unprefixed; EN/FR under /en/ and /fr/)
languages: ["it", "en", "fr"]
default_lang: "it"
# Soft launch: hide IT/EN/FR buttons on Italian pages so the site does not
# look fully translated yet. Author preview: open any URL under /en/ or /fr/
# (e.g. /en/about.html) — the switcher appears there. Set true to announce.
lang_switcher_public: false
# Keep parallel off so custom plugins (image intrinsic size) and paginate
# run predictably in each language build.
parallel_localization: false
# Shared once at site root — not copied under /en/ or /fr/.
# (Plugin-generated sitemap.xml is stripped from /en|/fr by
# _plugins/strip_localized_sitemaps.rb; listing it here alone is not enough.)
exclude_from_localization:
  - assets
  - robots.txt
  - CNAME
  - google3e4b083f6284aa55.html

plugins:
  - jekyll-polyglot
  - jekyll-paginate
  - jekyll-sitemap

# Articles in _posts/ use the post layout by default (no layout: in front matter).
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

include: [_pages]

# Added to Jekyll's own excludes, not a replacement for them: Jekyll concatenates
# DEFAULT_EXCLUDES (Gemfile, node_modules/, vendor/*, caches) onto this list. Paths
# starting with `.` or `_` never get copied either, so only repo noise that Jekyll
# would otherwise publish needs listing here.
exclude:
  - scripts/
  - README.md
  - LICENSE
  - NOTICE
  - renovate.json
  - contenuto-errori.md
