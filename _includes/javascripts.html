{% include locale.html %}
{%- comment -%}
search.json is language-scoped (IT at /search.json, EN at /en/search.json), and
polyglot does not rewrite paths inside <script>, hence lang_prefix.
{%- endcomment -%}
{%- assign search_json = lang_prefix | append: '/search.json' -%}

<script>
  // Localized strings consumed by the static, non-Liquid files in assets/js.
  window.i18n = {
    openMenu: {{ ui.open_menu | default: 'Apri menu' | jsonify }},
    closeMenu: {{ ui.close_menu | default: 'Chiudi menu' | jsonify }}
  };
  window.searchConfig = {
    json: {{ search_json | jsonify }},
    noResultsText: {{ ui.no_results | default: 'Nessun risultato' | jsonify }},
    errorText: {{ ui.search_unavailable | default: 'Ricerca non disponibile in questo momento.' | jsonify }}
  };
</script>

{% if page.layout == "post" %}
  <script>
    function copyToClipboard() {
      {% if site.active_lang and site.active_lang != site.default_lang %}
      var url = {{ site.url | append: '/' | append: site.active_lang | append: page.url | jsonify }};
      {% else %}
      var url = {{ site.url | append: page.url | jsonify }};
      {% endif %}
      navigator.clipboard.writeText(url).then(function() {
        var alerts = document.getElementsByClassName('alert');
        for (var i = 0; i < alerts.length; i++) {
          alerts[i].textContent = '\u00AB' + {{ ui.link_copied | default: 'link copiato' | jsonify }} + '\u00BB';
          setTimeout((function(el) {
            return function() { el.textContent = ''; };
          })(alerts[i]), 1600);
        }
      }, function() {
        prompt({{ ui.copy_failed | default: 'Impossibile copiare, usa questo link:' | jsonify }}, url);
      });
    }
  </script>
{% endif %}

<script src="/assets/js/main.js"></script>
<script src="/assets/js/search.js"></script>
