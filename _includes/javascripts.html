{% include calculate_relative_base.html %}
{% include escape-404.html %}
{% include locale.html %}

<script src="{{ relativebase }}assets/js/jekyll-search.js"></script>

<script>
  // Localized strings consumed by assets/js/main.js (a static, non-Liquid file).
  window.i18n = {
    openMenu: {{ ui.open_menu | default: 'Apri menu' | jsonify }},
    closeMenu: {{ ui.close_menu | default: 'Chiudi menu' | jsonify }},
    youtubeVideo: {{ ui.youtube_video | default: 'Video YouTube' | jsonify }}
  };
</script>

{% if page.layout == "post" %}
  <script>
    function copyToClipboard() {
      var url = '{{ site.url }}{{ page.url }}';
      navigator.clipboard.writeText(url).then(function() {
        var alerts = document.getElementsByClassName('alert');
        for (var i = 0; i < alerts.length; i++) {
          alerts[i].textContent = '\u00AB' + {{ ui.link_copied | default: 'link copiato' | jsonify }} + '\u00BB';
          setTimeout((function(el) {
            return function() { el.textContent = ''; };
          })(alerts[i]), 1600);
        }
      }, function() {
        prompt({{ ui.copy_failed | default: 'Impossibile copiare, usa questo link:' | jsonify }}, url);
      });
    }
  </script>
{% endif %}

<script src="{{ relativebase }}assets/js/main.js"></script>
<script>
  function escapeSearchHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  SimpleJekyllSearch({
      searchInput: document.getElementById('search-input'),
      resultsContainer: document.getElementById('results-container'),
      json: '{{ relativebase }}search.json',
      searchResultTemplate: '<li><a href="{url}" title="{description}">{title}</a><p>{description}</p></li>',
      templateMiddleware: function (prop, value) {
        return escapeSearchHtml(value);
      },
      noResultsText: {{ ui.no_results | default: 'Nessun risultato' | jsonify }},
      fuzzy: false
    });
</script>
