{% comment %}
  Click-to-load YouTube facade: no iframe (and no YouTube cookies) until play.
  youtube_id is set by the {% youtube %} tag in _plugins/youtube.rb.
  Click handling lives in assets/js/main.js.
{% endcomment %}
{% include locale.html %}
<div
  class="embed-container youtube-embed"
  data-youtube-id="{{ youtube_id }}"
  data-iframe-title="{{ ui.youtube_video | default: 'Video YouTube' | escape }}"
>
  <button
    type="button"
    class="youtube-play"
    aria-label="{{ ui.play_youtube_video | default: 'Riproduci video YouTube' | escape }}"
  >
    <img
      class="youtube-thumb"
      src="https://i.ytimg.com/vi/{{ youtube_id }}/hqdefault.jpg"
      alt=""
      width="480"
      height="360"
      loading="lazy"
      decoding="async"
    >
    <span class="youtube-play-icon" aria-hidden="true"></span>
  </button>
</div>
