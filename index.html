---
layout: home-page
---

<ol class="post-card-box clearfix">
  {% for post in paginator.posts %}
  <li>
    <div class="post-card">
      <a href="{{ post.url }}" title="{{ post.title }}" class="post-card-image">
        <img src="/assets/img/{{ post.img }}" alt="{{ post.title }}"{% if forloop.index > 2 %} loading="lazy"{% endif %}>
      </a>
      <div class="post-card-body">
        <p class="post-card-title-and-meta">
          
          <a href="{{ post.url }}" class="post-card-link">
          {{ post.title }}
          </a>
          {% include post_meta.html type="post-card-meta" date="none" %}
        </p>
      </div>
    </div>
  </li>
  {% endfor %}
</ol>
