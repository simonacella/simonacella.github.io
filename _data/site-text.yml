# Localized site copy keyed by locale.
# Resolved via _includes/locale.html as `sitetext.<key>` for the active language.
#
# The site brand title stays Italian everywhere — use site.title from _config.yml,
# not a localized key here. description / about_* / pages.* may differ by language.
#
# NOTE: Italian `description` is also kept in _config.yml because plugins
# (jekyll-feed, jekyll-sitemap) read it from site config. Keep those two in sync.
#
# pages.<content_id>.title|description override front matter when
# page.content_id is set (shared Liquid pages: about, archive, tags,
# not_found). Note: content_id, NOT page_id — page_id is reserved by
# jekyll-polyglot for its own translation matching; do not reuse it here.
#
# --- Translating a post (pairing convention) ---
# Italian posts use lang: it. Copy and rename with a language suffix before .md:
#   _posts/2024-01-15-Touki-Bouki.md     → lang: it
#   _posts/2024-01-15-Touki-Bouki.en.md  → lang: en
#   _posts/2024-01-15-Touki-Bouki.fr.md  → lang: fr
# Keep the same title as Italian (site permalinks are title-based, so this
# keeps IT/EN/FR on the same path for the language switcher). Translate
# description + body. Tag keys stay Italian; display labels in tag-labels.yml.
#
# The en / fr translations below are seeded for review by the author (native
# IT/FR speaker) and can be refined without touching templates.

it:
  description: "Alcune osservazioni sul cinema africano e terzo cinema"
  about_author: "Sceneggiatrice, produttrice, critica cinematografica"
  about_author_long: |
    Esperta di cinema africano e terzo cinema, Simona Cella si è laureata in Storia del Cinema presso l’Università degli Studi di Parma con una tesi sul cinema di Djibril Diop Mambety.

    Dopo una lunga esperienza nella produzione cinematografica come story editor e responsabile sviluppo si dedica alla curatela di
    progetti artistici e cinematografici tra Italia, Nigeria, Sri Lanka e Senegal.

    Negli ultimi anni si è specializzata in pratiche di cinema espanso inteso come processo multidisciplinare che accompagna la produzione
    di un film attivando progetti artistici paralleli in un’ottica di valorizzazione e rigenerazione culturale del territorio.

    E' cofondatrice del Collettivo Kaur Gou Mak luogo di produzione artistica, riflessione e confronto sul concetto di identità femminile
    che si ispira al pensiero e all’esperienza di scrittrici quali bell hooks, Ken Bugul, Toni Morrison, Maya Deren.

    E' autrice di sceneggiature e scrive di cinema per Nigrizia e Africa & Mediterraneo.

    Ha curato insieme a Cinzia Quadrati la monografia "Djibril Diop Mambety o il viaggio della Iena",
    con prefazione di Martin Scorsese, pubblicato in Italia e Francia da Editions L'Harmattan.

    Collabora con artisti, registi, collettivi, associazioni culturali, produzioni cinematografiche,
    istituzioni culturali, scuole ed università.
  pages:
    about:
      title: "Chi sono"
      description: "Profilo di Simona Cella, critica e autrice di cinema africano e terzo cinema."
    archive:
      title: "Archivio"
      description: "Tutti gli articoli de Il cinema come amuleto, dal più recente al più vecchio."
    tags:
      title: "Tag"
      description: "Indice dei tag per esplorare gli articoli per regista, paese e tema."
    not_found:
      title: "Pagina non trovata"

en:
  description: "Some observations on African cinema and Third Cinema"
  about_author: "Screenwriter, producer, film critic"
  about_author_long: |
    An expert in African cinema and Third Cinema, after a long experience in film production and cultural
    organisation she specialised in the development and curation of expanded cinema projects, understood as
    a multidisciplinary process that accompanies the production of a film by activating parallel artistic
    projects with a view to enhancing and culturally regenerating the territory.

    She writes screenplays and writes about cinema for Nigrizia and Africa & Mediterraneo.

    Together with Cinzia Quadrati she edited the monograph "Djibril Diop Mambety, or the journey of the Hyena",
    with a preface by Martin Scorsese, published in Italy and France by Editions L'Harmattan.

    She collaborates with artists, directors, collectives, cultural associations, film productions, cultural
    institutions, schools and universities.
  pages:
    about:
      title: "About"
      description: "Profile of Simona Cella, critic and author of African cinema and Third Cinema."
    archive:
      title: "Archive"
      description: "All articles from Il cinema come amuleto, newest first."
    tags:
      title: "Tags"
      description: "Browse articles by director, country, and theme."
    not_found:
      title: "Page not found"

fr:
  description: "Quelques observations sur le cinéma africain et le tiers cinéma"
  about_author: "Scénariste, productrice, critique de cinéma"
  about_author_long: |
    Spécialiste du cinéma africain et du tiers cinéma, après une longue expérience dans le monde de la
    production cinématographique et de l’organisation culturelle, elle s’est spécialisée dans le
    développement et la curation de projets de cinéma élargi, entendu comme un processus pluridisciplinaire
    qui accompagne la production d’un film en activant des projets artistiques parallèles, dans une optique
    de valorisation et de régénération culturelle du territoire.

    Elle est autrice de scénarios et écrit sur le cinéma pour Nigrizia et Africa & Mediterraneo.

    Elle a dirigé avec Cinzia Quadrati la monographie « Djibril Diop Mambety ou le voyage de la Hyène »,
    préfacée par Martin Scorsese, publiée en Italie et en France par les Éditions L'Harmattan.

    Elle collabore avec des artistes, des réalisateurs, des collectifs, des associations culturelles, des
    productions cinématographiques, des institutions culturelles, des écoles et des universités.
  pages:
    about:
      title: "À propos"
      description: "Profil de Simona Cella, critique et autrice de cinéma africain et de tiers cinéma."
    archive:
      title: "Archives"
      description: "Tous les articles d’Il cinema come amuleto, du plus récent au plus ancien."
    tags:
      title: "Mots-clés"
      description: "Parcourir les articles par réalisateur, pays et thème."
    not_found:
      title: "Page introuvable"
