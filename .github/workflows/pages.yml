name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Post images in assets/img/posts are stored in Git LFS.
          # Without this, checkout only gets pointer files and the site
          # would publish broken images.
          lfs: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Build with Jekyll
        run: |
          set -o pipefail
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" 2>&1 | tee /tmp/jekyll-build.log
          if grep -q "YAML Exception" /tmp/jekyll-build.log; then
            echo "::error::Jekyll reported YAML front matter errors; refusing to deploy."
            exit 1
          fi
        env:
          JEKYLL_ENV: production

      # Author keeps uploading .jpg/.png and linking those names; production serves WebP.
      - name: Optimize images for deploy
        run: python3 scripts/optimize-site-images.py _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
