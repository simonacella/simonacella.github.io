<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>CMS — Il cinema come amuleto</title>
  </head>
  <body>
    <!-- Pin the version. Bump deliberately after checking release notes. -->
    <script src="https://unpkg.com/@sveltia/cms@0.206.0/dist/sveltia-cms.js"></script>
    <script>
      // Workaround: opening an entry often leaves the edit pane mid-form.
      // Reset .content to top; drop when Sveltia fixes initial scroll/focus.
      (function () {
        function scrollEditorsToTop() {
          document.querySelectorAll(".content").forEach(function (el) {
            if (el.scrollHeight > el.clientHeight + 8) el.scrollTop = 0;
          });
        }

        function maybeReset() {
          if (!/#\/collections\/[^/]+\/(entries\/|new)/.test(location.hash)) return;
          scrollEditorsToTop();
          requestAnimationFrame(scrollEditorsToTop);
          setTimeout(scrollEditorsToTop, 100);
          setTimeout(scrollEditorsToTop, 400);
        }

        window.addEventListener("hashchange", maybeReset);
        ["pushState", "replaceState"].forEach(function (name) {
          var orig = history[name];
          history[name] = function () {
            var ret = orig.apply(this, arguments);
            maybeReset();
            return ret;
          };
        });
      })();
    </script>
    <script>
      // Insert → YouTube writes the site Liquid tag {% youtube "…" %}.
      (function () {
        function youtubeId(url) {
          if (!url) return "";
          var m =
            url.match(/youtu\.be\/([A-Za-z0-9_-]{11})/) ||
            url.match(/(?:v=|\/embed\/|\/v\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
          return m ? m[1] : "";
        }

        CMS.registerEditorComponent({
          id: "youtube",
          label: "YouTube",
          icon: "youtube_activity",
          fields: [
            {
              name: "url",
              label: "URL del video",
              widget: "string",
              hint: "youtu.be/… oppure youtube.com/watch?v=…",
            },
          ],
          pattern: /\{\%\s*youtube\s+["'](?<url>[^"']+)["']\s*\%\}/m,
          toBlock: function (data) {
            var url = (data && data.url ? String(data.url) : "").trim();
            return '{% youtube "' + url + '" %}';
          },
          toPreview: function (data) {
            var url = (data && data.url ? String(data.url) : "").trim();
            var id = youtubeId(url);
            if (!id) {
              return url
                ? "<p><code>{% youtube &quot;" +
                    url.replace(/&/g, "&amp;").replace(/</g, "&lt;") +
                    "&quot; %}</code></p>"
                : "";
            }
            // Thumbnail only — live iframes hit YouTube error 153 without a
            // usable Referer (CMS preview / strict referrer policies).
            return (
              '<p><a href="https://www.youtube.com/watch?v=' +
              id +
              '" target="_blank" rel="noopener noreferrer">' +
              '<img src="https://i.ytimg.com/vi/' +
              id +
              '/hqdefault.jpg" alt="Anteprima YouTube" ' +
              'width="480" height="360" ' +
              'style="max-width:100%;height:auto;border:0;border-radius:4px"></a></p>'
            );
          },
        });
      })();
    </script>
  </body>
</html>
